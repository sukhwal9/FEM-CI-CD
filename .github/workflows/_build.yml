# .github/workflows/_build.yml — Stable stage, segment 10
# Reusable workflow: builds the Astro site by calling the build-astro composite.
# Triggered only by workflow_call. Both ci.yml and deploy.yml call this.

name: Build (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version (e.g. `22`) to use for the build.
        required: false
        default: '22'
        type: string
      artifact-name:
        description: Name of the uploaded artifact.
        required: false
        default: dist
        type: string
      deploy:
        description: Whether to deploy the build artifact.
        required: false
        default: false
        type: boolean
    outputs:
      artifact-name:
        description: Name of the artifact produced by the build job.
        value: ${{ jobs.build.outputs.artifact-name }}


jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.echo.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Astro
        uses: ./.github/actions/build-astro
        with:
          node-version: ${{ inputs.node-version }}
          artifact-name: ${{ inputs.artifact-name }}

      - name: Echo artifact name
        id: echo
        run: echo "name=${{ inputs.artifact-name }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy to S3
        run: aws s3 sync dist/ s3://fem-ci-cd/ --delete
